<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 AI Medical Chatbot</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem 1rem;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to bottom right, #eef4ff, #f9fbff);
        color: #1f2937;
      }

      .chat-container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        text-align: center;
        font-size: 2rem;
        color: #2563eb;
        margin-bottom: 2rem;
      }

      #chat-box {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .message {
        max-width: 85%;
        padding: 1rem 1.2rem;
        border-radius: 18px;
        line-height: 1.6;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease-in-out;
      }

      .message strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        border-bottom-right-radius: 6px;
      }

      .assistant {
        align-self: flex-start;
        background: #f3f4f6;
        color: #111827;
        border: 1px solid #e5e7eb;
        border-bottom-left-radius: 6px;
      }

      form {
        margin-top: 1rem;
      }

      textarea {
        width: 100%;
        min-height: 70px;
        resize: vertical;
        padding: 1rem;
        border-radius: 14px;
        border: 1px solid #d1d5db;
        font-size: 1rem;
        font-family: inherit;
        outline: none;
        transition: all 0.2s ease;
      }

      textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      }

      .button-group {
        display: flex;
        gap: 1rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 0.85rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .send-btn {
        background: #2563eb;
        color: white;
      }

      .send-btn:hover {
        background: #1d4ed8;
      }

      .clear-btn {
        background: #ef4444;
        color: white;
      }

      .clear-btn:hover {
        background: #dc2626;
      }

      .error {
        background: #fee2e2;
        color: #b91c1c;
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 1rem;
        border: 1px solid #fecaca;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .chat-container {
          padding: 1.25rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        .message {
          max-width: 100%;
        }

        .button-group {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <h1>🩺 AI Medical Chatbot</h1>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <div id="chat-box">
        {% for msg in messages %}
        <div class="message {{ msg.role }}">
          <strong>{{ msg.role|capitalize }}</strong>
          {{ msg.content | safe | nl2br }}
        </div>
        {% endfor %}
      </div>

      <form method="post" action="{{ url_for('index') }}">
        <textarea
          name="prompt"
          placeholder="Ask a medical question..."
          required
        ></textarea>

        <div class="button-group">
          <button type="submit" class="send-btn">Send Message</button>
        </div>
      </form>

      <form method="get" action="{{ url_for('clear') }}">
        <div class="button-group">
          <button type="submit" class="clear-btn">Clear Chat</button>
        </div>
      </form>
    </div>
  </body>
</html>
